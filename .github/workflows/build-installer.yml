name: Build Release

on:
  workflow_dispatch:
  push:
    branches:
      - legacy-installer

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    env:
      NUGET_CERT_REVOCATION_MODE: offline

    steps:
    - name: Checkout
      uses: actions/checkout@v4.1.6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        submodules: recursive
        lfs: true

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64

    - name: Setup .NET
      uses: actions/setup-dotnet@v4.0.0
      with:
        dotnet-version: "8"

    - name: Restore NuGet Packages
      run: nuget restore Rectify11Installer.sln

    - name: Build
      run: msbuild Rectify11Installer.sln /p:Configuration=Release /p:platform=x64

    - name: Publish
      run: dotnet publish Rectify11Installer -c Release -p:PublishProfile=FolderProfile -property:SolutionDir=${{ github.workspace }}\

    - name: Verify output
      shell: pwsh
      run: |
        $dir = "Rectify11Installer\bin\Release\net8.0-windows\publish\win-x64"
        if (Test-Path $dir) { Get-ChildItem -Recurse $dir -File | Select-Object -ExpandProperty Name | Select-Object -First 40 } else { Write-Error "No publish dir"; exit 1 }

    - name: Compress publish folder
      shell: pwsh
      run: |
        $dir = "Rectify11Installer\bin\Release\net8.0-windows\publish\win-x64"
        Compress-Archive -Path "$dir\*" -DestinationPath "$dir\Rectify11Installer.zip" -CompressionLevel Optimal
        Get-Item "$dir\Rectify11Installer.zip" | Select-Object Name, Length

    - name: Upload artifact
      uses: actions/upload-artifact@v4.3.3
      with:
        name: Rectify11Installer-x64
        path: Rectify11Installer\bin\Release\net8.0-windows\publish\win-x64\
        compression-level: 0

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: v1.0.0-${{ github.run_id }}
      shell: pwsh
      run: |
        $dir = "Rectify11Installer\bin\Release\net8.0-windows\publish\win-x64"
        $zip = Join-Path $dir "Rectify11Installer.zip"
        if (-not (Test-Path $zip)) { Write-Error "zip not found"; exit 1 }
        $release = gh release create $env:TAG "$zip" --repo ${{ github.repository }} --title "Rectify11 Installer build ${{ github.run_id }}" --notes "Automated build of Rectify11 Installer." --latest
        Write-Host "Release created: $release"