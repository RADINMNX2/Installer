name: Build Release

on:
  workflow_dispatch:
  push:
    branches:
      - legacy-installer

jobs:
  build:
    runs-on: windows-latest
    env:
      NUGET_CERT_REVOCATION_MODE: offline

    steps:
    - name: Checkout
      uses: actions/checkout@v4.1.6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        submodules: recursive
        lfs: true

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64

    - name: Setup .NET
      uses: actions/setup-dotnet@v4.0.0
      with:
        dotnet-version: "8"

    - name: Restore NuGet Packages
      run: nuget restore Rectify11Installer.sln

    - name: Build Phase2
      run: msbuild Rectify11.Phase2\Rectify11.Phase2.csproj /p:Configuration=Release /p:platform=x64

    - name: Build Installer
      run: msbuild Rectify11Installer\Rectify11Installer.csproj /p:Configuration=Release /p:platform=x64

    - name: Publish
      run: dotnet publish Rectify11Installer -c Release -p:PublishProfile=FolderProfile -property:SolutionDir=${{ github.workspace }}\

    - name: Verify output
      shell: pwsh
      run: |
        $dir = "Rectify11Installer\bin\Release\net8.0-windows\publish\win-x64"
        if (Test-Path $dir) { Get-ChildItem -Recurse $dir -File | Select-Object -ExpandProperty Name | Select-Object -First 40 } else { Write-Error "No publish dir"; exit 1 }

    - name: Compress publish folder
      shell: pwsh
      run: |
        $dir = "Rectify11Installer\bin\Release\net8.0-windows\publish\win-x64"
        Compress-Archive -Path "$dir\*" -DestinationPath "$dir\Rectify11Installer.zip" -CompressionLevel Optimal
        Get-Item "$dir\Rectify11Installer.zip" | Select-Object Name, Length

    - name: Create Release
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $dir = "Rectify11Installer\bin\Release\net8.0-windows\publish\win-x64"
        $files = @(Get-ChildItem -Recurse $dir -File | Select-Object -ExpandProperty FullName)
        if ($files.Count -eq 0) { Write-Error "No publish output found"; exit 1 }
        $tag = "v1.0.0-$env:GITHUB_RUN_ID"
        gh release create "$tag" --title "Rectify11 Installer build $env:GITHUB_RUN_ID" --notes "Automated build from run $env:GITHUB_RUN_ID." @files